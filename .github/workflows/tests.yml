name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Suite JS (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # El manifiesto declara @abdsynths/i18n y @abdsynths/scope como
      # `workspace:*`, protocolo que npm rechaza fuera del monorepo padre
      # (EUNSUPPORTEDPROTOCOL). Mientras eso siga así se instalan aquí solo las
      # herramientas de test: vitest y jsdom, que vitest.config.js exige y
      # package.json no declaraba.
      #
      # --legacy-peer-deps no es un capricho: con npm 10 (el que trae Node 22 en
      # el runner) el árbol de vitest 4.1.11 no resuelve y el install muere con
      # "Cannot read properties of null (reading 'edgesOut')". Comprobado con
      # npm 10.9 en local: sin el flag falla, con el flag instala y la suite pasa.
      - name: Herramientas de test
        run: |
          mkdir -p "$RUNNER_TEMP/deps"
          npm install --no-save --no-package-lock --no-audit --no-fund \
            --legacy-peer-deps --prefix "$RUNNER_TEMP/deps" vitest@4.1.11 jsdom@24

      # vite resuelve los imports del config (`vitest/config`) desde el proyecto,
      # no desde el binario que lo ejecuta. En un checkout limpio no hay
      # node_modules, así que sin este enlace el arranque muere con
      # ERR_MODULE_NOT_FOUND; en local no se nota porque el workspace padre lo
      # hoistea.
      - name: Suite
        run: |
          [ -e node_modules ] || ln -s "$RUNNER_TEMP/deps/node_modules" node_modules
          "$RUNNER_TEMP/deps/node_modules/.bin/vitest" run --reporter=dot

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Mismo motivo que en el job web: eslint no es dependencia del manifiesto.
      - name: ESLint
        run: |
          mkdir -p "$RUNNER_TEMP/deps"
          npm install --no-save --no-package-lock --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/deps" eslint@10

      # Falla solo con errores; los avisos son deuda declarada (catch vacíos y
      # variables sin usar en los ficheros duplicados que Q2 va a eliminar).
      - name: Lint
        run: '"$RUNNER_TEMP/deps/node_modules/.bin/eslint" .'

  dsp:
    name: Tests C++ (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Los tres targets de test son JUCE-free; JUCE_PATH apunta a una ruta
      # inexistente en el runner para que no se cuele un JUCE del sistema.
      #
      # Sin -G a propósito: la imagen de Windows ya no trae Visual Studio 2022,
      # así que fijar el generador rompe el job cada vez que GitHub actualiza la
      # versión de VS instalada. CMake elige el más reciente que encuentre.
      - name: Configurar
        run: >-
          cmake -S . -B build_ci
          -DJUCE_PATH=ci-sin-juce
          -DABDSHARED_BUILD_DSPCORE_TESTS=ON
          -DABDSHARED_BUILD_SYNTHCORE_TESTS=ON
          -DABDSHARED_BUILD_DSPEFFECTS_TESTS=ON
          -DABDSHARED_BUILD_AUTOUPDATER=OFF
          -DABDSHARED_BUILD_HARDWAREDRIVERS=OFF
          -DABDSHARED_BUILD_AUDIOCOMPARATOR=OFF

      - name: Compilar
        run: >-
          cmake --build build_ci --config Release
          --target ABDShared_DspCore_Tests ABDShared_SynthCore_Tests ABDShared_DspEffects_Tests

      - name: Ejecutar
        shell: pwsh
        run: |
          $binaries = @(
            'build_ci/Code/Release/ABDShared_DspCore_Tests.exe',
            'build_ci/Code/Release/ABDShared_SynthCore_Tests.exe',
            'build_ci/Code/Release/ABDShared_DspEffects_Tests.exe'
          )
          $failed = @()
          foreach ($binary in $binaries) {
            Write-Host "== $binary"
            & $binary
            if ($LASTEXITCODE -ne 0) { $failed += $binary }
          }
          if ($failed.Count -gt 0) {
            throw "Fallaron: $($failed -join ', ')"
          }
